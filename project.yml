name: ProbeApp
options:
  bundleIdPrefix: com.saravanan.probe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ProbeApp:
    type: application
    platform: iOS
    sources: [ProbeApp/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saravanan.probe.ProbeApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Probe
        CODE_SIGNING_ALLOWED: NO
