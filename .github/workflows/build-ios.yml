name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        label: [macos-15, macos-15-arm64, macos-26, macos-latest]
    runs-on: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -E "^Xcode" || true
          XC=$(ls -d /Applications/Xcode*.app | grep -vE "\.app\.app" | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned, generic iOS device)
        run: |
          xcodebuild \
            -project ProbeApp.xcodeproj \
            -scheme ProbeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          test -n "$APP" || { echo "NO APP BUILT"; exit 1; }
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ProbeApp.ipa Payload
          ls -la ProbeApp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ProbeApp-ipa-${{ matrix.label }}
          path: ProbeApp.ipa
